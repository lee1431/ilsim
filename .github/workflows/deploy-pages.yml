name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Pages source
        run: |
          cat source/ilsim-pages.zip.b64.* > /tmp/ilsim-pages.b64
          base64 -d /tmp/ilsim-pages.b64 > /tmp/ilsim-pages.zip
          unzip -q /tmp/ilsim-pages.zip -d /tmp/ilsim-pages-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: /tmp/ilsim-pages-src/ilsim-pages
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: /tmp/ilsim-pages-src/ilsim-pages
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ilsim-pages-src/ilsim-pages/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
