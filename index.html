<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#0b1110;color:#eef2ef;overflow:hidden}button{font:inherit}.hidden{display:none!important}

.portalMain{width:min(1180px,calc(100% - 36px));margin:auto;padding:76px 0 90px}.eyebrow{color:#efa93f;letter-spacing:3px;font-size:10px;font-weight:800}.portalMain h1{margin:14px 0 10px;font-size:clamp(38px,6vw,72px);letter-spacing:-4px;line-height:1}.lead{max-width:680px;color:#9ba7a3;line-height:1.75;font-size:14px}.sectionTitle{margin:56px 0 18px;display:flex;justify-content:space-between;align-items:end;gap:20px}.sectionTitle h2{margin:0;font-size:22px}.sectionTitle span{color:#7d8985;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-height:210px;padding:24px;border:1px solid #ffffff18;background:#14201de8;color:inherit;text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:.18s}.card:hover:not(:disabled){transform:translateY(-3px);border-color:#efa93f88;background:#182824}.card:disabled{opacity:.45;cursor:not-allowed}.card strong{display:block;font-size:25px;margin:44px 0 10px}.card p{color:#8f9b97;font-size:12px;line-height:1.6;margin:0}.idx{position:absolute;top:20px;right:22px;font:800 12px monospace;color:#efa93f}.tag{position:absolute;left:24px;bottom:22px;font-size:9px;letter-spacing:1px;color:#efa93f}.crumb{color:#78847f;font-size:11px;margin-bottom:38px}.crumb button{border:0;background:none;color:#efa93f;padding:0;cursor:pointer}
.sim,.world{position:fixed;inset:0}.world canvas{display:block}header{position:fixed;z-index:5;left:18px;right:18px;top:16px;height:58px;padding:0 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#101917e8;border:1px solid #ffffff20;box-shadow:0 12px 40px #0007}.logo{font-size:19px;font-weight:900}.logo>b{background:#f2a93b;color:#17201e;padding:6px 8px;margin-right:3px}.logo span{font-size:10px;color:#96a29e;margin-left:8px}.clock{text-align:center;font:700 20px monospace;color:#f2b34b}.clock small{display:block;font:8px Arial;letter-spacing:2px;color:#8e9995;margin-top:2px}header>button{justify-self:end;background:none;border:0;color:#aeb7b4;cursor:pointer}.back{position:fixed;z-index:9;top:26px;left:170px;background:transparent;border:1px solid #ffffff20;color:#aeb7b4;padding:7px 9px;cursor:pointer}
.radio{position:fixed;z-index:5;top:88px;left:50%;transform:translateX(-50%);min-width:440px;background:#172421e8;border-left:3px solid #f2ad42;padding:11px 17px;box-shadow:0 8px 28px #0006}.radio span{font-size:9px;color:#f2ad42;margin-right:14px}.radio b{font-size:12px}.mission,.queue,.stamina{position:fixed;z-index:5;left:18px;width:260px;background:#101917e8;border:1px solid #ffffff1d;padding:14px}.mission{top:92px}.queue{top:285px;padding:12px}.stamina{bottom:20px;width:240px;padding:12px}.mission small,.mission b,.mission em{display:block}.mission small{font-size:8px;letter-spacing:2px;color:#87938f}.mission b{font-size:12px;margin:6px 0 10px}.bar{height:4px;background:#ffffff16}.bar span{display:block;height:100%;background:#f2ad42}.mission em{font-style:normal;text-align:right;font-size:9px;color:#96a29e;margin-top:6px}.queueHead,.staminaHead{display:flex;justify-content:space-between;font-size:10px}.queueHead{margin-bottom:8px}.queueHead span{color:#efad45}.queue article{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #ffffff12}.queue article>strong{display:grid;place-items:center;width:25px;height:25px;background:#efad45;color:#17201e;font-size:11px}.queue p,.queue small{display:block;margin:0;font-size:8px}.queue small{margin-top:2px;color:#89948f}.queue em{color:#c1c9c6;font-size:8px;font-style:normal}.jam{display:block;margin-top:8px;padding:7px;background:#6f2d22;color:#ffd3c9;font-size:8px;font-style:normal;text-align:center}.stamina .bar{height:7px;margin:7px 0}.stamina .bar i{display:block;height:100%;background:linear-gradient(90deg,#e76a3a,#efbb44,#61b981)}.stamina small{color:#89948f;font-size:9px}
.tools{position:fixed;z-index:6;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px}.tools button{background:#111b19e8;color:#b9c2bf;border:1px solid #ffffff1d;padding:10px 13px;cursor:pointer}.tools button b{color:#f2ad42;margin-right:7px}.tools button.on{border-color:#f2ad42;color:#fff}.tools button:disabled{opacity:.45}.notice{position:fixed;z-index:5;bottom:75px;left:50%;transform:translateX(-50%);background:#0d1513e8;border:1px solid #ffffff1d;padding:9px 16px;font-size:11px;max-width:620px;text-align:center}.cross{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;pointer-events:none}.cross i{position:absolute;background:#fff8;box-shadow:0 0 2px #000}.cross i:first-child{width:20px;height:1px;top:10px}.cross i:last-child{height:20px;width:1px;left:10px}
.pda,.tray{position:fixed;z-index:7;right:18px;top:88px;bottom:20px;width:330px;box-shadow:0 15px 45px #0009;overflow:auto}.pda{background:#d9ded8;color:#15201d;border:7px solid #1c2825;border-radius:13px}.tray{background:#111b19ee;border:1px solid #ffffff26}.pdaTop,.trayTop{display:flex;justify-content:space-between;padding:12px}.pdaTop{background:#1e2d29;color:#fff}.pdaTop button{background:none;border:0;color:#fff;font-size:17px}.delivery{padding:13px;border-bottom:1px solid #aeb7b1}.delivery>*{display:block}.delivery small{font-size:8px;color:#69746f}.delivery b{font:700 15px monospace;margin:4px 0}.delivery span{font-size:9px;color:#69746f}.ok{font:9px monospace;background:#407b63;color:#fff;padding:8px 12px}.compare{padding:10px 12px}.compare>div{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #b9c1bc}.compare b,.compare small{display:block}.compare b{font:700 10px monospace}.compare small{font:8px monospace;color:#66716d;margin-top:3px}.compare em{font:700 10px monospace;font-style:normal}.compare i{padding:3px 5px;background:#407b63;color:#fff;font-size:8px;font-style:normal}.action{width:calc(100% - 24px);margin:5px 12px 12px;background:#eaa640;border:0;padding:11px;font-weight:800;cursor:pointer}.ready{padding:24px 14px;text-align:center}.ready p{color:#65706b;font-size:10px;line-height:1.6}.ready span{display:block;margin-top:18px;padding:10px;background:#c8d0ca;font-size:10px}.trayTop{border-bottom:1px solid #ffffff1c}.trayTop span{color:#efad45;font-size:12px}.tray>p{margin:0;padding:11px 14px;color:#899590;font-size:11px}.labelList{display:grid;gap:7px;padding:0 12px 14px}.labelList button{display:grid;grid-template-columns:52px 1fr;padding:10px;background:#e7eddc;color:#142019;border:3px solid transparent;text-align:left;cursor:pointer}.labelList button.sel{border-color:#efaa3d}.labelList small{grid-row:span 2;align-self:center;font:11px monospace;color:#6b746d}.labelList strong{font:800 20px monospace}.labelList span{font:10px monospace;color:#5d6861}
.start{position:fixed;z-index:20;inset:0;background:#0b1210e8;display:grid;place-items:center;backdrop-filter:blur(9px)}.start>div{width:min(640px,calc(100vw - 30px));border:1px solid #ffffff25;background:#14201d;padding:55px;text-align:center;box-shadow:12px 12px 0 #e8a33b}.start small{color:#e8a33b;letter-spacing:3px;font-size:9px}.start h1{font-size:45px;margin:14px}.start p{color:#aeb8b4;line-height:1.8;font-size:13px}.start button{display:block;margin:25px auto 15px;background:#e8a33b;color:#15201d;border:0;padding:14px 28px;font-weight:900;cursor:pointer}.start em{font-style:normal;font-size:9px;color:#77847f}.next{position:fixed;z-index:8;left:50%;bottom:116px;transform:translateX(-50%);padding:11px 16px;background:#efad45;color:#17201e;font-size:10px;font-weight:800}
@media(max-width:800px){.grid{grid-template-columns:1fr}.portalMain{padding-top:46px}.portalMain h1{letter-spacing:-2px}.brand small,.clock,.queue{display:none}.radio{top:85px;min-width:0;width:calc(100% - 36px)}.mission{top:145px;width:220px}.pda,.tray{width:270px;top:155px}.back{top:84px;left:18px}.stamina{bottom:68px;width:190px}.notice{bottom:115px}.start>div{padding:35px 22px}.start h1{font-size:35px}}

<body><div id="app"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const app=document.querySelector('#app');
const jobs=[{id:'logistics',name:'물류',desc:'입고 · 출고 · 재고 흐름을 현장처럼 체험합니다.',roles:[{id:'inspection',name:'물품검수요원',desc:'도크 이동 · PDA 스캔 · 납품서 대조 · 셀/렉 라벨 부착',on:true},{id:'forklift',name:'지게차',desc:'하차 · 적치 · 파렛트 이동 · 동선 판단',on:false},{id:'office',name:'전산',desc:'입고등록 · 재고 확인 · 작업지시 · 예외 처리',on:false}]}];
const batches=[['AX-2143','L260830-A','2026-08-30','A-03-12',4,0xe7a44b],['AX-2143','L260829-C','2026-08-29','A-03-14',6,0xd98b3a],['AX-2148','L260830-B','2026-08-30','B-01-07',3,0x4f8fbf],['AX-2183','L260828-D','2026-08-28','B-02-04',3,0x5b7aa8],['BX-2208','L260830-A','2026-08-30','C-04-02',2,0x6d9b67]];
const master=batches.flatMap(b=>Array.from({length:b[4]},()=>({code:b[0],lot:b[1],date:b[2],cell:b[3],color:b[5]}))).map((p,i)=>({...p,id:i+1}));
const makePallets=(count,cycle=0)=>Array.from({length:count},(_,i)=>{const s=master[(i+cycle*3)%master.length];return {...s,id:i+1,lot:`${s.lot.slice(0,-1)}${String.fromCharCode(65+((i+cycle)%4))}`,scanned:false,labeled:false,applied:null}});
let sim=null;const go=p=>location.hash='#'+p;
function shell(html,back){app.innerHTML=`<div class="portal"><div class="nav"><div class="brand"><b>일</b>sim <small>JOB SIMULATOR</small></div>${back?'<button id="back">← 이전</button>':'<span></span>'}</div><main class="portalMain">${html}</main></div>`;if(back)document.querySelector('#back').onclick=()=>go(back)}
function home(){const cards=jobs.map((j,i)=>`<button class="card" data-job="${j.id}"><span class="idx">0${i+1}</span><strong>${j.name}</strong><p>${j.desc}</p><span class="tag">업무 선택 →</span></button>`).join('');shell(`<span class="eyebrow">일을 배우는 가장 빠른 방법</span><h1>일단 해보자.</h1><p class="lead">설명만 듣지 말고 직접 움직이고, 눌러보고, 틀려보는 업무 시뮬레이터입니다. 실수해도 월급에서 안 까입니다.</p><div class="sectionTitle"><h2>업무 선택</h2><span>체험할 현장을 선택하세요</span></div><div class="grid">${cards}</div>`);document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>go('/'+b.dataset.job))}
function logistics(){const j=jobs[0];const cards=j.roles.map((r,i)=>`<button class="card" data-role="${r.id}" ${r.on?'':'disabled'}><span class="idx">0${i+1}</span><strong>${r.name}</strong><p>${r.desc}</p><span class="tag">${r.on?'체험 시작 →':'준비중'}</span></button>`).join('');shell(`<div class="crumb"><button id="home">업무 선택</button> / 물류</div><span class="eyebrow">LOGISTICS CENTER</span><h1>물류</h1><p class="lead">같은 물류센터라도 맡은 직무에 따라 보는 화면과 판단해야 할 정보가 달라집니다.</p><div class="sectionTitle"><h2>직무 선택</h2><span>현재 1개 직무 체험 가능</span></div><div class="grid">${cards}</div>`,'/');document.querySelector('#home').onclick=()=>go('/');document.querySelectorAll('[data-role]:not(:disabled)').forEach(b=>b.onclick=()=>go('/logistics/'+b.dataset.role))}
function route(){if(sim){sim.destroy();sim=null}const p=(location.hash.slice(1)||'/').replace(/\/+$/,'')||'/';if(p==='/')home();else if(p==='/logistics')logistics();else if(p==='/logistics/inspection')sim=new Inspection();else shell(`<span class="eyebrow">404</span><h1>퇴근길을 잃었습니다.</h1><p class="lead">존재하지 않는 업무입니다.</p>`,'/')}
class Inspection{
 constructor(){this.s={started:false,stamina:100,time:'08:17',pallets:makePallets(18),selected:null,printed:null,compared:false,labelsPrinted:false,used:new Set(),dock:12,arrivals:[{dock:12,vehicle:'충북 84바 1234',pallets:18,status:'하차 중'}],radio:'12번 도크, 충북 84바 1234 윙바디 들어갑니다.',pda:false,msg:'무전을 확인하고 12번 도크로 이동하십시오.'};this.t=[];this.render();this.w=new World(this.world,()=>this.s,p=>this.touch(p),(x,t)=>{this.s.stamina=x;this.s.time=t;this.hud()});this.bind();this.ui()}
 render(){app.innerHTML=`<main class="sim"><div class="world" id="world"></div><header><div class="logo"><b>일</b>sim <span>입고검수 체험</span></div><div class="clock"><span id="clock">08:17</span><small>08:00 — 18:00</small></div><button id="reset">↻ 재시작</button></header><button class="back" id="exit">← 직무 선택</button><div class="radio"><span>● 무전 수신</span><b id="radio"></b></div><div class="mission" id="mission"></div><div class="queue" id="queue"></div><div class="stamina"><div class="staminaHead"><span>STAMINA</span><b id="sv">100</b></div><div class="bar"><i id="sb" style="width:100%"></i></div><small>Shift를 누르면 달립니다</small></div><div class="tools"><button><b>1</b> 무전기</button><button id="pdaBtn"><b>2</b> PDA</button><button id="printer" disabled><b>3</b> 라벨 프린터</button></div><aside class="pda hidden" id="pda"></aside><aside class="tray hidden" id="tray"></aside><div class="notice" id="notice"></div><div class="cross"><i></i><i></i></div><div class="start" id="start"><div><small>직무체험 01 · 물류센터</small><h1>입고검수 요원</h1><p>무전을 듣고 도크로 이동해 혼합제품 18파렛트의<br>제품코드·LOT·날짜를 대조하고 셀 라벨을 부착하십시오.</p><button id="startBtn">작업장 들어가기</button><em>WASD 이동 · Shift 달리기 · 마우스 시점 · 클릭 스캔</em></div></div><div class="next hidden" id="next"></div></main>`;['world','clock','radio','mission','queue','sv','sb','pdaBtn','printer','pda','tray','notice','start','next'].forEach(id=>this[id]=document.getElementById(id))}
 bind(){document.getElementById('exit').onclick=()=>go('/logistics');document.getElementById('reset').onclick=()=>this.reset();document.getElementById('startBtn').onclick=()=>this.startGame();this.pdaBtn.onclick=()=>{if(this.scanned()<this.s.pallets.length)return;this.s.pda=!this.s.pda;if(this.s.pda&&document.pointerLockElement)document.exitPointerLock();this.ui()}}
 startGame(){this.s.started=true;this.start.classList.add('hidden');this.s.msg='작업 시작 — 무전을 확인하고 12번 도크로 이동하십시오.';this.schedule();this.ui()}
 schedule(){this.clearTimers();const add=(d,a)=>this.t.push(setTimeout(()=>{this.s.arrivals.push(...a);this.s.radio=a.map(x=>`${x.dock}번 ${x.vehicle}, ${x.pallets}파렛트`).join(' / ')+' 들어갑니다.';this.ui()},d));add(18000,[{dock:4,vehicle:'경기 91가 5678',pallets:12,status:'진입'}]);add(36000,[{dock:9,vehicle:'충남 87다 4455',pallets:18,status:'하차 중'},{dock:2,vehicle:'경북 73머 8012',pallets:8,status:'진입'},{dock:7,vehicle:'서울 96사 2204',pallets:15,status:'검수 대기'}]);add(62000,[{dock:10,vehicle:'경기 82로 7719',pallets:18,status:'진입'}])}
 clearTimers(){this.t.forEach(clearTimeout);this.t=[];if(this.adv)clearTimeout(this.adv);this.adv=null}scanned(){return this.s.pallets.filter(x=>x.scanned).length}attached(){return this.s.used.size}
 touch(p){const x=this.s.pallets.find(v=>v.id===p.id);if(!this.s.compared){if(!x.scanned)x.scanned=true;this.s.msg=`파렛트 ${x.id}번 업체 라벨 스캔 완료 (${this.scanned()}/${this.s.pallets.length})`;if(this.scanned()===this.s.pallets.length){this.s.pda=true;this.s.msg=`${this.s.pallets.length}파렛트 스캔 완료 — 스캔 목록과 납품서를 대조하십시오.`;if(document.pointerLockElement)document.exitPointerLock()}this.ui();return}if(!this.s.labelsPrinted){this.s.msg='먼저 PDA 하단의 라벨 전체 출력 버튼을 누르십시오.';return this.ui()}if(!this.s.printed){this.s.msg='우측 출력 라벨함에서 부착할 라벨을 먼저 선택하십시오.';return this.ui()}if(x.labeled){this.s.msg=`파렛트 ${x.id}에는 이미 라벨이 붙어 있습니다.`;return this.ui()}x.labeled=true;x.applied=this.s.printed.id;this.s.used.add(this.s.printed.id);this.s.printed=null;this.s.msg=`파렛트 ${x.id}에 라벨을 부착했습니다.`;this.w.syncTags();this.ui();this.advance()}
 batches(){const m=new Map;this.s.pallets.forEach(p=>{const k=`${p.code}|${p.lot}|${p.date}|${p.cell}`;m.set(k,m.has(k)?{...m.get(k),count:m.get(k).count+1}:{...p,count:1})});return [...m.values()]}
 compare(){this.s.compared=true;this.s.msg='납품서 대조 완료 — WMS가 셀·렉 번호를 자동 지정했습니다.';this.ui()}print(){this.s.labelsPrinted=true;this.s.pda=false;this.s.msg=`셀·렉 라벨 ${this.s.pallets.length}장 출력 완료 — 우측에서 라벨을 선택해 해당 파렛트에 부착하십시오.`;this.ui()}
